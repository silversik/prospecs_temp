<html>

<head>
    <meta name="viewport"
        content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/ps-new.css">
</head>

<body style="padding-top:100px;">
    <div id="psWrap" class="ps-wrap ps-new sub">
            <main id="container">
        <div data-aos="ps-fade-in" data-aos-once="true"
            class="ps-prd-list--wrap overflow-hidden px-gutter aos-init aos-animate w-full" id="listBox">
            <div class="ps-col">
                <a href="javascript:void(0);" class="ps-prd-item"
                    onclick="ngjfInifiniteScroll.pushLinkHistory(0,0,this); jfCtPrdChg(0,this,3); return false;"
                    data-goodsnum="0">
                    <div class="thumbs ratio1">
                        <img id="prodImg_0"
                            src="https://timg.prospecs.com/prod/PW0UL26/PW0UL26S201/PW0UL26S201_01.jpg/dims/resizef/530x530/optimize"
                            onerror="this.src='https://timg.prospecs.com/prod/error/noimg.jpg/dims/resizef/530x530/optimize'"
                            alt="PW0UL26S201">
                            <span class="badge">NEW</span>
                            <button class="toggle-wish-btn"></button>
                    </div>
                    <div class="desc">
                        <p class="name line-clamp-2">에센셜 슬라이드</p>
                        <div class="price">
                            <input type="hidden" id="pri_0" value="49000">
                            <p class="amount">49,000원</p>
                        </div>
                        <div class="badge">
                        </div>
                    </div>
                </a>
            </div>
            <div class="ps-col">
                <a href="javascript:void(0);" class="ps-prd-item"
                    onclick="ngjfInifiniteScroll.pushLinkHistory(0,1,this); jfCtPrdChg(1,this,3); return false;"
                    data-goodsnum="1">
                    <div class="thumbs ratio1">
                        <img id="prodImg_1"
                            src="https://timg.prospecs.com/prod/PW0UL26/PW0UL26S202/PW0UL26S202_01.jpg/dims/resizef/530x530/optimize"
                            onerror="this.src='https://timg.prospecs.com/prod/error/noimg.jpg/dims/resizef/530x530/optimize'"
                            alt="PW0UL26S202">
                            <span class="badge">UNISEX</span>
                            <button class="toggle-wish-btn on"></button>
                    </div>
                    <div class="desc">
                        <p class="name line-clamp-2">에센셜 슬라이드</p>
                        <div class="price">
                            <input type="hidden" id="pri_1" value="49000">
                            <p class="amount">49,000원</p>
                        </div>
                        <div class="badge">
                        </div>
                    </div>
                </a>
            </div>
            <div class="ps-col">
                <a href="javascript:void(0);" class="ps-prd-item"
                    onclick="ngjfInifiniteScroll.pushLinkHistory(0,2,this); jfCtPrdChg(2,this,3); return false;"
                    data-goodsnum="2">
                    <div class="thumbs ratio1"> <img id="prodImg_2"
                            src="https://timg.prospecs.com/prod/PW0UL26/PW0UL26S203/PW0UL26S203_01.jpg/dims/resizef/530x530/optimize"
                            onerror="this.src='https://timg.prospecs.com/prod/error/noimg.jpg/dims/resizef/530x530/optimize'"
                            alt="PW0UL26S203">
                    </div>
                    <div class="desc">
                        <p class="name line-clamp-2">에센셜 슬라이드</p>
                        <div class="price">
                            <input type="hidden" id="pri_2" value="49000">
                            <p class="amount">49,000원</p>
                        </div>
                        <div class="badge">
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </main>

    </div>
    <script>
		/* 샘플 스크립트 */
		const wishBtns = document.querySelectorAll('.toggle-wish-btn');
		wishBtns.forEach(btn => {
			btn.addEventListener('click', (e) => {
				e.preventDefault();
				e.stopPropagation();

				btn.classList.toggle('on');
			});
		});
	</script>
</body>

</html>
