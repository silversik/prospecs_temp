	<script>
		/* 샘플 스크립트 */
		const wishBtns = document.querySelectorAll('.toggle-wish-btn');
		wishBtns.forEach(btn => {
			btn.addEventListener('click', (e) => {
				e.preventDefault();
				e.stopPropagation();

				btn.classList.toggle('on');
			});
		});
